<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Охота на лис</title>
    <style>
        :root {
            --bg-color: #1a1a24;
            --board-bg: #2d2d3f;
            --cell-bg: #3f3f5a;
            --cell-safe: #6B8A72;
            /* Цвет безопасной неоткрытой ячейки */
            --cell-hover: #6B8A72;
            --cell-revealed: #e0e0e0;
            --text-color: #f0f0f0;
            --accent: #ff6b35;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        h1 {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitle {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 20px;
        }

        .stats {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            font-size: 1.2em;
            background: var(--board-bg);
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .stat-box {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .stat-box span {
            color: var(--accent);
            font-weight: bold;
            font-size: 1.3em;
            line-height: 1;
        }

        .stat-box .stat-diff {
            font-size: 0.7em;
            margin-left: 3px;
            font-weight: bold;
        }

        .stat-box .diff-minus {
            color: #31D978;
        }

        /* Зеленый */
        .stat-box .diff-plus {
            color: #ff3f3f;
        }

        /* Красный */
        .stat-box .diff-equal {
            color: #888888;
        }

        /* Серый */

        .board {
            display: grid;
            grid-template-columns: repeat(10, 40px);
            grid-template-rows: repeat(10, 40px);
            gap: 4px;
            background: var(--board-bg);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .cell {
            background-color: var(--cell-bg);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.2);
            position: relative;
        }

        /* Новый стиль для безопасных зон, которые просканировал радар */
        .cell.safe-zone:not(.revealed) {
            background-color: var(--cell-safe);
            box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.15);
        }

        .cell:hover:not(.revealed) {
            background-color: var(--cell-hover);
            transform: translateY(-1px);
        }

        .cell.revealed {
            background-color: var(--cell-revealed);
            color: #333;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
            cursor: default;
        }

        .cell.fox {
            background-color: var(--accent);
            font-size: 1.5em;
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 15px var(--accent);
            z-index: 2;
        }

        .cell.safe-zone:not(.revealed)::before {
            content: '🍄';
            font-size: 0.7em;
            /* У лисички 1.5em, у обычного текста 1.2em */
            animation: pop 0.3s ease;
        }

        /* Класс для вспышки безопасных линий (при нуле) */
        .cell.highlight-line:not(.revealed) {
            background-color: rgba(46, 204, 113, 0.7) !important;
            transition: background-color 0.1s;
        }

        /* Анимация обновления цифры */
        .cell.update-flash {
            animation: text-flash 0.5s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            80% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes text-flash {
            0% {
                transform: scale(1);
                color: var(--accent);
            }

            50% {
                transform: scale(1.4);
                color: var(--accent);
            }

            100% {
                transform: scale(1);
            }
        }

        /* Цвета для цифр радара */
        .cell.revealed.val-1 {
            color: #1565c0;
        }

        .cell.revealed.val-2 {
            color: #2e7d32;
        }

        .cell.revealed.val-3 {
            color: #c62828;
        }

        .cell.revealed.val-4 {
            color: #4527a0;
        }

        .cell.revealed.val-5 {
            color: #ef6c00;
        }

        .cell.revealed.val-6 {
            color: #00838f;
        }

        .cell.revealed.val-7 {
            color: #424242;
        }

        .cell.revealed.val-8 {
            color: #000000;
        }

        .controls {
            margin-top: 25px;
        }

        button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(255, 107, 53, 0.3);
        }

        button:hover {
            background: #ff8555;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(1px);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 10;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--board-bg);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transform: translateY(20px);
            transition: transform 0.3s;
            border: 2px solid var(--accent);
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-content h2 {
            margin-top: 0;
            color: var(--accent);
            font-size: 2em;
        }

        @media (max-width: 500px) {
            .board {
                grid-template-columns: repeat(10, 30px);
                grid-template-rows: repeat(10, 30px);
            }

            .cell {
                font-size: 1em;
            }

            .cell.fox {
                font-size: 1.2em;
            }
        }
    </style>
</head>

<body>

    <h1>Охота на лис</h1>
    <div class="subtitle">Найди всех спрятанных Лис</div>

    <div class="stats">
        <div class="stat-box">Лисы: <span id="foxes-count">0</span> / 9</div>
        <div class="stat-box">Ходы: <span id="turns-count">0</span></div>
        <div class="stat-box">Результат: <span id="record-count">-</span><span id="record-diff"
                class="stat-diff"></span></div>
    </div>

    <div class="board" id="board"></div>

    <div class="controls">
        <button onclick="initGame()">Новая игра</button>
    </div>

    <div class="modal-overlay" id="win-modal">
        <div class="modal-content">
            <h2>Охота завершена! 🦊</h2>
            <p>Вы нашли всех лис за <span id="final-turns"
                    style="color: var(--accent); font-weight:bold; font-size: 1.2em;"></span> ходов.</p>
            <button onclick="initGame()" style="margin-top: 15px;">Играть снова</button>
        </div>
    </div>

    <script>
        const SIZE = 10;
        const TOTAL_FOXES = 9;

        let board = [];
        let foxes = [];
        let foxesFound = 0;
        let turns = 0;
        let prevRecord = 100;
        let isGameOver = false;

        const boardEl = document.getElementById('board');
        const foxesCountEl = document.getElementById('foxes-count');
        const turnsCountEl = document.getElementById('turns-count');
        const winModal = document.getElementById('win-modal');
        const finalTurnsEl = document.getElementById('final-turns');
        const recordCountEl = document.getElementById('record-count');
        const recordDiffEl = document.getElementById('record-diff');

        // Загрузка сохранённого рекорда при старте
        function loadRecord() {
            const savedRecord = null; //localStorage.getItem('fox_record');
            if (savedRecord !== null) {
                recordCountEl.textContent = savedRecord;
            }
        }

        function initGame() {
            board = [];
            foxes = [];
            foxesFound = 0;
            turns = 0;
            isGameOver = false;
            //loadRecord();

            foxesCountEl.textContent = foxesFound;
            turnsCountEl.textContent = turns;
            recordCountEl.textContent = prevRecord;
            winModal.classList.remove('active');
            boardEl.innerHTML = '';

            for (let r = 0; r < SIZE; r++) {
                let row = [];
                for (let c = 0; c < SIZE; c++) {
                    row.push({ r: r, c: c, isFox: false, isRevealed: false });
                    const cellEl = document.createElement('div');
                    cellEl.className = 'cell';
                    cellEl.dataset.r = r;
                    cellEl.dataset.c = c;
                    cellEl.addEventListener('click', handleCellClick);
                    boardEl.appendChild(cellEl);
                }
                board.push(row);
            }

            let placed = 0;
            while (placed < TOTAL_FOXES) {
                let r = Math.floor(Math.random() * SIZE);
                let c = Math.floor(Math.random() * SIZE);
                if (!board[r][c].isFox) {
                    board[r][c].isFox = true;
                    foxes.push({ r, c, found: false });
                    placed++;
                }
            }
        }

        function countVisibleFoxes(r, c) {
            let count = 0;
            for (let fox of foxes) {
                if (fox.found) continue;
                if (fox.r === r || fox.c === c || Math.abs(fox.r - r) === Math.abs(fox.c - c)) {
                    count++;
                }
            }
            return count;
        }

        function highlightZeroLines(r, c) {
            const cellsToHighlight = [];
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE; j++) {
                    if (i === r || j === c || Math.abs(i - r) === Math.abs(j - c)) {
                        if (i !== r || j !== c) {
                            const cellObj = board[i][j];
                            if (!cellObj.isRevealed) {
                                const el = document.querySelector(`.cell[data-r="${i}"][data-c="${j}"]`);
                                if (el) cellsToHighlight.push(el);
                            }
                        }
                    }
                }
            }

            // Добавляем класс вспышки и перманентный класс безопасной зоны
            cellsToHighlight.forEach(el => {
                el.classList.add('highlight-line');
                el.classList.add('safe-zone');
            });

            // Убираем яркую зеленую вспышку через 400 мс (цвет safe-zone останется)
            setTimeout(() => {
                cellsToHighlight.forEach(el => el.classList.remove('highlight-line'));
            }, 400);
        }

        function updateRevealedCells(foundFoxR, foundFoxC) {
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE; j++) {
                    const cellObj = board[i][j];

                    if (cellObj.isRevealed && !cellObj.isFox) {
                        if (i === foundFoxR || j === foundFoxC || Math.abs(i - foundFoxR) === Math.abs(j - foundFoxC)) {
                            const el = document.querySelector(`.cell[data-r="${i}"][data-c="${j}"]`);
                            let currentVal = parseInt(el.textContent) || 0;

                            if (currentVal > 0) {
                                el.classList.remove(`val-${currentVal > 8 ? 8 : currentVal}`);
                                el.classList.remove('update-flash');

                                void el.offsetWidth; // Форсируем перерисовку

                                let newVal = currentVal - 1;
                                if (newVal > 0) {
                                    el.textContent = newVal;
                                    el.classList.add(`val-${newVal > 8 ? 8 : newVal}`);
                                    el.classList.add('update-flash');
                                } else {
                                    // Значение стало 0 - очищаем текст
                                    el.textContent = '';
                                    el.classList.add('update-flash');

                                    // ЦЕПНАЯ РЕАКЦИЯ: запускаем радар с небольшой задержкой для красивого эффекта
                                    setTimeout(() => {
                                        highlightZeroLines(i, j);
                                    }, 250);
                                }
                            }
                        }
                    }
                }
            }
        }

        function handleCellClick(e) {
            if (isGameOver) return;

            const r = parseInt(e.target.dataset.r);
            const c = parseInt(e.target.dataset.c);
            const cellData = board[r][c];

            if (cellData.isRevealed) return;

            turns++;
            turnsCountEl.textContent = turns;
            cellData.isRevealed = true;
            e.target.classList.add('revealed');

            if (cellData.isFox) {
                e.target.classList.add('fox');
                e.target.textContent = '🦊';
                foxesFound++;
                foxesCountEl.textContent = foxesFound;

                let foxObj = foxes.find(f => f.r === r && f.c === c);
                if (foxObj) foxObj.found = true;

                updateRevealedCells(r, c);

                if (foxesFound === TOTAL_FOXES) {
                    gameOver();
                }
            } else {
                const visible = countVisibleFoxes(r, c);

                if (visible > 0) {
                    e.target.textContent = visible;
                    e.target.classList.add(`val-${visible > 8 ? 8 : visible}`);
                } else {
                    highlightZeroLines(r, c);
                }
            }
        }

        function gameOver() {
            isGameOver = true;


            if (prevRecord !== null) {
                const prev = prevRecord;
                const diff = turns - prev;

                if (diff > 0) {
                    recordDiffEl.textContent = `+${diff}`;
                    recordDiffEl.className = 'stat-diff diff-plus';
                } else if (diff < 0) {
                    recordDiffEl.textContent = `${diff}`;
                    recordDiffEl.className = 'stat-diff diff-minus';
                } else {
                    recordDiffEl.textContent = '=';
                    recordDiffEl.className = 'stat-diff diff-equal';
                }
            }

            prevRecord = turns;
            recordCountEl.textContent = turns;

            setTimeout(() => {
                finalTurnsEl.textContent = turns;
                winModal.classList.add('active');
            }, 600);
        }

        initGame();
    </script>
    <script>
        // Сообщаем Telegram, что приложение готово к отображению
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            // Можно даже развернуть игру на весь экран
            window.Telegram.WebApp.expand();
        }
    </script>
</body>

</html>
